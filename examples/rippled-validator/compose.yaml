services:
  rippled:
    image: xrpllabsofficial/xrpld:latest
    container_name: rippled-validator
    restart: unless-stopped
    volumes:
      - ./rippled/config:/config
      - ./rippled/var/lib/rippled/db:/var/lib/rippled/db
    ports:
      # Exporter metrics — must be published so Prometheus can scrape them.
      # The exporter runs in this container's network namespace (network_mode: container:)
      # and binds to this port from within that shared namespace.
      - "9999:9999"
      #- "80:80"
      #- "443:443"
      #- "6006:6006"
      #- "51235:51235"
